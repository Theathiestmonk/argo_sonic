  bt_navigator:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      odom_topic: /odom
      bt_loop_duration: 10
      default_server_timeout: 80
      wait_for_service_timeout: 2000
      action_server_result_timeout: 900.0
      transform_tolerance: 1.0
      # These two are dead values — nav.launch.py and slam.launch.py both
      # override them at launch time via get_package_share_directory, since
      # a plain YAML params file can't read $ENV_VARS the way a launch file
      # can. Edit the launch files' bt_xml_path if the BT file ever moves.
      default_nav_to_pose_bt_xml: "/home/argo/my_project/argo_sonic/src/argo_mini/config/bt/navigate_to_pose.xml"
      default_nav_through_poses_bt_xml: "/home/argo/my_project/argo_sonic/src/argo_mini/config/bt/navigate_to_pose.xml"
      plugin_lib_names:
        - nav2_compute_path_to_pose_action_bt_node
        - nav2_follow_path_action_bt_node
        - nav2_pipeline_sequence_bt_node
        - nav2_recovery_node_bt_node
        - nav2_rate_controller_bt_node
        # Recovery is a RoundRobin of "clear the local costmap" and "back up
        # 10 cm" (see bt/navigate_to_pose.xml), so both of those node types
        # have to be registered here: RoundRobin itself, and BackUp. Spin is
        # still deliberately absent — the tree never references it.
        - nav2_clear_costmap_service_bt_node
        - nav2_round_robin_node_bt_node
        - nav2_back_up_action_bt_node

  controller_server:
    ros__parameters:
      use_sim_time: false
      controller_frequency: 20.0
      costmap_update_timeout: 2.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 3.0
      transform_tolerance: 1.0
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.30
        # Lowered from 30.0, then again from 10.0 — safety_shield has no
        # visibility into Nav2 and never reports "blocked," so
        # controller_server has no way to know its commands are being
        # zeroed downstream until this checker's own timeout expires. At
        # 30s the robot sat stuck in front of an obstacle for a full 30
        # seconds before recovery (backup/spin/wait) ever kicked in; 10.0
        # cut that to a 3x-faster stuck-detection.
        #
        # 2.0 is a deliberately aggressive re-tightening for "recover from
        # stuck fast" — worth flagging the actual math, since it's tight
        # enough to matter: required_movement_radius(0.30) / 2.0 = 0.15 m/s
        # average, which equals vx_max below EXACTLY. 10.0 had real margin
        # (0.30/10.0 = 0.03 m/s, well under vx_max); 2.0 has none — any
        # normal moment of less-than-peak speed (accelerating from rest, a
        # turn, cautious movement near an obstacle) can trip this. If the
        # robot starts doing little unwanted backup/spin hiccups during
        # otherwise-normal travel (not an actual stall), this is the first
        # value to raise back up — try 4.0-5.0 as a middle ground before
        # going all the way back to 10.0.
        movement_time_allowance: 2.0
      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        # 0.40 -> 0.50. Arrival is position-only (see yaw below), and half a
        # robot length of slack is what keeps a forward-only base from having
        # to thread a needle it has no reverse gear to correct for.
        xy_goal_tolerance: 0.50
        # 1.57 -> 3.15, i.e. "any heading". Deliberately above pi:
        # SimpleGoalChecker::isGoalReached takes shortest_angular_distance,
        # which is bounded to [-pi, pi], so any threshold > pi makes the yaw
        # term unconditionally true and arrival depends on position alone.
        #
        # This is fixing a contradiction, not just loosening a number.
        # GoalAngleCritic was removed from the critics list below precisely
        # so the robot would stop rotating to meet a requested final heading
        # — but this checker still DEMANDED that heading to within +-90 deg.
        # Nothing was left to satisfy it. The robot would reach the goal
        # position, sit outside the yaw window with no critic pulling it in,
        # never register arrival, and keep orbiting the point: MPPI still
        # minimising distance-to-goal, no reverse (vx_min: 0.0) to correct an
        # overshoot, and the progress checker quiet throughout because the
        # robot genuinely was moving. That showed up as patrol circling its
        # goal forever and never completing a lap.
        #
        # If a caller ever does need a specific final heading, add a second
        # entry to goal_checker_plugins and select it per-goal with
        # FollowPath's goal_checker_id — do not re-tighten this one, or the
        # orbiting comes straight back.
        yaw_goal_tolerance: 3.15
        stateful: true
      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 30
        model_dt: 0.05
        # Raised from 1000 - more sampled candidate trajectories per cycle
        # gives MPPI a better chance of finding a way around a sudden nearby
        # obstacle without needing a full global replan. Jetson Orin has
        # headroom for this; re-profile controller_server CPU/GPU load if
        # FollowPath starts missing its 20Hz controller_frequency cycle.
        batch_size: 2000
        vx_std: 0.2
        vy_std: 0.2
        # Kept matched 1:1 with wz_max above
        wz_std: 0.4
        # Back down to 0.35 after trying 0.50. Speed is capped in three
        # places and all three move together: MPPI vx_max (here),
        # velocity_smoother max_velocity (below), and serial_bridge VMAX —
        # miss one and it silently clamps the wheels back down.
        #
        # There is no approach-speed scaling on top of this any more: the
        # /speed_limit halving inside the last metre (goal_approach_limiter)
        # was removed along with the 0.50 cruise it existed to tame. This is
        # the speed everywhere, arrival included.
        vx_max: 0.35
        vx_min: 0.0
        vy_max: 0.0
        vy_min: 0.0
        # Increased to 0.4 for faster turns
        wz_max: 0.4
        # ####################################################################
        # INERT ON THIS NAV2 VERSION. nav2_mppi_controller 1.1.20 (Humble)
        # has NO acceleration constraints: models/constraints.hpp defines
        # ControlConstraints as exactly {vx_max, vx_min, vy, wz}, and the
        # strings ax_max / ax_min / az_max appear nowhere in the installed
        # headers. `ros2 param list /controller_server` confirms it —
        # FollowPath.vx_max and FollowPath.wz_max are declared, ax_max and
        # az_max are "Parameter not set", because nothing ever declares them.
        #
        # So none of the five keys below do anything today, and none of the
        # reasoning previously written here about no-slip thresholds or
        # "MPPI plans its own ramp" was ever in effect. The ONLY thing
        # shaping acceleration on this robot is velocity_smoother's
        # max_accel/max_decel further down, which is measurable: a 0 -> 0.35
        # step on /cmd_vel_raw comes out of /cmd_vel_smoothed as a 0.20 m/s^2
        # ramp, exactly matching max_accel[0].
        #
        # Kept rather than deleted because they are harmless and become live
        # on Nav2 1.3+/Jazzy, where MPPI did gain acceleration constraints.
        # Do not tune them here expecting an effect on this robot — change
        # velocity_smoother instead.
        # ####################################################################
        ax_max: 0.25
        ax_min: -0.15
        ay_min: 0.0
        ay_max: 0.0
        az_max: 0.25
        # Raised from 1 - a second refinement pass per control cycle on top
        # of the larger batch_size above, for better-quality candidate
        # trajectories when working around an obstacle. Same GPU-headroom
        # caveat as batch_size above applies.
        iteration_count: 2
        temperature: 0.3
        gamma: 0.015
        motion_model: "DiffDrive"
        diff_drive:
          plugin: "nav2_mppi_controller::DiffDriveMotionModel"
        visualize: false
        reset_period: 1.0
        # Was false - reusing/perturbing the same noise samples cycle to
        # cycle instead of drawing fresh ones can leave MPPI stuck exploring
        # a similar (bad) trajectory pattern repeatedly. true draws fresh
        # noise every cycle, at a small added compute cost, so a locally
        # stuck-feeling moment has a better chance of resolving on its own
        # rather than needing a BackUp/Spin recovery.
        regenerate_noises: true
        # Also inert on 1.1.20 — "sgf_order" is not in the installed headers.
        sgf_order: 2
        TrajectoryVisualizer:
          trajectory_step: 5
          time_step: 3
        # Inert too: neither TrajectoryValidator nor
        # DefaultOptimalTrajectoryValidator nor collision_lookahead_time
        # exists in nav2_mppi_controller 1.1.20. On this version collision
        # checking is CostCritic's job (see its consider_footprint and
        # collision_cost below), which IS live. Left in place for a future
        # Nav2 upgrade, same reasoning as the acceleration block above.
        TrajectoryValidator:
          plugin: "nav2_mppi_controller::DefaultOptimalTrajectoryValidator"
          collision_lookahead_time: 2.0
          consider_footprint: false
        # GoalAngleCritic removed - "rotate at goal" behavior; the robot no
        # longer needs to face the goal's requested final orientation, only
        # reach its position (see yaw_goal_tolerance above).
        critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 6.0
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 12.0
          threshold_to_consider: 1.4
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 10.0
          threshold_to_consider: 0.5
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 10.0
          critical_cost: 200.0
          consider_footprint: true
          collision_cost: 1000000.0
          near_goal_distance: 1.0
          trajectory_point_step: 2
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          max_path_occupancy_ratio: 0.15
          trajectory_point_step: 4
          threshold_to_consider: 0.5
          offset_from_furthest: 10
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 10.0
          offset_from_furthest: 5
          threshold_to_consider: 1.4
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 10.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.0
          mode: 0

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 10.0
        publish_frequency: 5.0
        use_sim_time: false
        global_frame: odom
        robot_base_frame: base_link
        transform_tolerance: 1.0     # Added
        rolling_window: true
        width: 6
        height: 6
        resolution: 0.05
        footprint: "[[0.265, 0.225], [0.265, -0.225], [-0.265, -0.225], [-0.265, 0.225]]"
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan_corrected
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            reliability_policy: "BEST_EFFORT" # ADDED: Required for /scan_corrected!
            sensor_frame: lidar_link          # ADDED: Matches frame_id published
            raytrace_max_range: 4.0
            raytrace_min_range: 0.30
            obstacle_max_range: 4.0
            obstacle_min_range: 0.30
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: true
          cost_scaling_factor: 2.5
          inflation_radius: 0.225

  velocity_smoother:
    ros__parameters:
      use_sim_time: false
      # FULLY REVERTED to the original 30.0/OPEN_LOOP — after changing these
      # to fix jerkiness, the robot stopped responding to any goal at all
      # (RViz AND the UI), and reverting feedback alone wasn't enough to
      # restore motion. Rolling back smoothing_frequency too so we're testing
      # against the exact pre-change config, to confirm whether this file is
      # the cause at all before looking elsewhere. Once nav is confirmed
      # working again on this exact config, re-apply and re-test ONE change
      # at a time (smoothing_frequency first, feedback second) rather than
      # both together, so a future regression is unambiguous about which one
      # did it.
      smoothing_frequency: 30.0
      feedback: "OPEN_LOOP"
      max_velocity: [0.35, 0.0, 0.3]
      min_velocity: [-0.30, 0.0, -0.3]
      # This is the ONLY acceleration limit in the whole pipeline. MPPI's
      # ax_max/az_max above are inert on Nav2 1.1.20 (see the block there),
      # so the controller emits whatever velocity step its optimiser likes
      # and this node is what turns that into a ramp. Measured: a 0 -> 0.35
      # step on /cmd_vel_raw leaves /cmd_vel_smoothed at 0.20 m/s^2, so
      # these numbers are real in a way the controller's are not.
      # Lowered 0.30 -> 0.20 linear and 0.3 -> 0.20 angular to cut jerk.
      #
      # Linear braking (max_decel[0]) is deliberately NOT softened. It is
      # what stops the robot at a goal, and at 0.35 m/s a gentler ramp
      # would coast further than the 0.50 m xy_goal_tolerance. It is also
      # not the emergency path — safety_shield sits AFTER this node
      # (/cmd_vel_smoothed -> /cmd_vel), so a hard stop goes straight to
      # the wheels without passing through max_decel at all. Angular
      # braking does come down to match the angular accel.
      max_accel: [0.20, 0.0, 0.20]
      max_decel: [-0.15, 0.0, -0.20]
      odom_topic: /odom
      velocity_timeout: 1.0

  behavior_server:
    ros__parameters:
      use_sim_time: false
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["backup", "spin", "wait"]
      backup:
        plugin: "nav2_behaviors/BackUp"
        # NOTE: backup_dist/backup_speed are NOT parameters of this plugin
        # and never were — nav2_behaviors/BackUp takes both from the action
        # goal. They are BT *input ports* (see back_up_action.hpp), so the
        # 10 cm limit lives on the <BackUp> node in bt/navigate_to_pose.xml.
        # The 0.5 m / 0.3 m/s that used to sit here were read by nothing.
      spin:
        plugin: "nav2_behaviors/Spin"
      wait:
        plugin: "nav2_behaviors/Wait"
      simulate_ahead_time: 2.0
      # Increased to 0.4 to match FollowPath's wz_max
      max_rotational_vel: 0.4
      # Lowered along with max_rotational_vel above - left at the old 0.15
      # this would equal the new max exactly, leaving Spin zero ramp range
      # (jumps straight to full speed with no gradual start).
      min_rotational_vel: 0.05
      rotational_acc_lim: 1.5
