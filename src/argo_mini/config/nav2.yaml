  bt_navigator:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      odom_topic: /odom
      bt_loop_duration: 10
      default_server_timeout: 80
      wait_for_service_timeout: 2000
      action_server_result_timeout: 900.0
      transform_tolerance: 1.0
      # These two are dead values — nav.launch.py and slam.launch.py both
      # override them at launch time via get_package_share_directory, since
      # a plain YAML params file can't read $ENV_VARS the way a launch file
      # can. Edit the launch files' bt_xml_path if the BT file ever moves.
      default_nav_to_pose_bt_xml: "/home/argo/my_project/argo_sonic/src/argo_mini/config/bt/navigate_to_pose.xml"
      default_nav_through_poses_bt_xml: "/home/argo/my_project/argo_sonic/src/argo_mini/config/bt/navigate_to_pose.xml"
      plugin_lib_names:
        - nav2_compute_path_to_pose_action_bt_node
        - nav2_follow_path_action_bt_node
        - nav2_pipeline_sequence_bt_node
        - nav2_recovery_node_bt_node
        - nav2_rate_controller_bt_node
        - nav2_round_robin_node_bt_node
        - nav2_back_up_action_bt_node
        - nav2_spin_action_bt_node
        - nav2_wait_action_bt_node

  controller_server:
    ros__parameters:
      use_sim_time: false
      controller_frequency: 20.0
      costmap_update_timeout: 2.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 3.0
      transform_tolerance: 1.0
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.30
        # Lowered from 30.0 — safety_shield has no visibility into Nav2 and
        # never reports "blocked," so controller_server has no way to know
        # its commands are being zeroed downstream until this checker's own
        # timeout expires. At 30s the robot sat stuck in front of an
        # obstacle for a full 30 seconds before recovery (backup/spin/wait)
        # ever kicked in. 10s is a 3x faster stuck-detection while still
        # generous enough not to false-trigger on genuinely slow movement
        # (0.30m in 10s is only ~3cm/s average, well under vx_max=0.15).
        movement_time_allowance: 10.0
      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.20
        # Raised from 0.13 - GoalAngleCritic (rotate-to-face-goal-heading)
        # is now removed below, so the robot no longer tries to match the
        # goal's requested final orientation. This just needs to be loose
        # enough to never block completion on whatever heading it arrives at.
        yaw_goal_tolerance: 1.57
        stateful: true
      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 30
        model_dt: 0.05
        batch_size: 1000
        vx_std: 0.2
        vy_std: 0.2
        # Kept matched 1:1 with wz_max above (was 0.4/0.4) - left at the old
        # ratio when wz_max was lowered, this would sample rotation candidates
        # from a spread wider than the entire valid range, clamping most of
        # them to the new max and biasing MPPI toward full-speed turns
        # whenever it needed to turn at all instead of graduating smoothly.
        wz_std: 0.15
        vx_max: 0.15
        vx_min: 0.0
        vy_max: 0.0
        vy_min: 0.0
        # Lowered from 0.4 - fast turns were causing wheel slip that fed
        # bad encoder ticks into odometry (see serial_bridge.py's implausible-
        # tick-delta handling). Kept in sync with velocity_smoother's angular
        # max_velocity and behavior_server's max_rotational_vel below.
        wz_max: 0.15
        # Reverted to 0.15 — the robot ran smoothest at this linear
        # speed/accel; 0.50 (tried 2026-08-15) was faster but rougher.
        ax_max: 0.15
        ax_min: -0.15
        ay_min: 0.0
        ay_max: 0.0
        # Wheel-level (slip-relevant) tangential accel from rotating is
        # az_max * (WHEEL_BASE/2) = az_max * 0.205 (WHEEL_BASE=0.41,
        # serial_bridge.py). Matching linear's 0.15 m/s² no-slip threshold
        # at the wheel gives az_max <= ~0.73 rad/s² headroom — 0.3 sits
        # comfortably under that with real margin, while staying responsive
        # enough for a service robot working close to tables/people.
        az_max: 0.3
        iteration_count: 1
        temperature: 0.3
        gamma: 0.015
        motion_model: "DiffDrive"
        diff_drive:
          plugin: "nav2_mppi_controller::DiffDriveMotionModel"
        visualize: false
        reset_period: 1.0
        regenerate_noises: false
        sgf_order: 2
        TrajectoryVisualizer:
          trajectory_step: 5
          time_step: 3
        TrajectoryValidator:
          plugin: "nav2_mppi_controller::DefaultOptimalTrajectoryValidator"
          collision_lookahead_time: 2.0
          consider_footprint: false
        # GoalAngleCritic removed - "rotate at goal" behavior; the robot no
        # longer needs to face the goal's requested final orientation, only
        # reach its position (see yaw_goal_tolerance above).
        critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 6.0
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 8.0
          threshold_to_consider: 1.4
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          # Restored to 5.0 — dropping this to 2.0 (uncommitted, undocumented
          # experiment) weakened the controller's bias against non-forward
          # trajectories, letting near-goal rotation-only paths score as
          # cheap as they liked. Symptom on-robot: repeated small
          # back-and-forth wiggling before settling at the goal, right where
          # PathAngleCritic/PathAlignCritic/PathFollowCritic (all still at
          # cost_weight 5.0) compete hardest for the final heading — with
          # PreferForward weak, MPPI had no strong pull back toward smooth
          # forward-biased trajectories to break the tie. (GoalAngleCritic
          # itself has since been removed — see yaw_goal_tolerance above.)
          cost_weight: 5.0
          threshold_to_consider: 0.5
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 10.0
          critical_cost: 200.0
          consider_footprint: true
          collision_cost: 1000000.0
          near_goal_distance: 1.0
          trajectory_point_step: 2
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          max_path_occupancy_ratio: 0.15
          trajectory_point_step: 4
          threshold_to_consider: 0.5
          offset_from_furthest: 10
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 1.4
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.0
          mode: 0

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 10.0
        publish_frequency: 5.0
        use_sim_time: false
        global_frame: odom
        robot_base_frame: base_link
        transform_tolerance: 1.0     # Added
        rolling_window: true
        width: 6
        height: 6
        resolution: 0.05
        footprint: "[[0.265, 0.225], [0.265, -0.225], [-0.265, -0.225], [-0.265, 0.225]]"
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /scan_corrected
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            reliability_policy: "BEST_EFFORT" # ADDED: Required for /scan_corrected!
            sensor_frame: lidar_link          # ADDED: Matches frame_id published
            raytrace_max_range: 4.0
            raytrace_min_range: 0.30
            obstacle_max_range: 4.0
            obstacle_min_range: 0.30
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: true
          cost_scaling_factor: 2.5
          inflation_radius: 0.225

  velocity_smoother:
    ros__parameters:
      use_sim_time: false
      # FULLY REVERTED to the original 30.0/OPEN_LOOP — after changing these
      # to fix jerkiness, the robot stopped responding to any goal at all
      # (RViz AND the UI), and reverting feedback alone wasn't enough to
      # restore motion. Rolling back smoothing_frequency too so we're testing
      # against the exact pre-change config, to confirm whether this file is
      # the cause at all before looking elsewhere. Once nav is confirmed
      # working again on this exact config, re-apply and re-test ONE change
      # at a time (smoothing_frequency first, feedback second) rather than
      # both together, so a future regression is unambiguous about which one
      # did it.
      smoothing_frequency: 30.0
      feedback: "OPEN_LOOP"
      max_velocity: [0.15, 0.0, 0.15]
      min_velocity: [-0.15, 0.0, -0.15]
      # Matched to the MPPI controller's ax_max/az_max above — the smoother
      # sits downstream and must never allow a sharper ramp than the
      # controller was already tuned for, or its output would just get
      # clamped there anyway.
      max_accel: [0.15, 0.0, 0.3]
      max_decel: [-0.15, 0.0, -0.3]
      odom_topic: /odom
      velocity_timeout: 1.0

  behavior_server:
    ros__parameters:
      use_sim_time: false
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["backup", "spin", "wait"]
      backup:
        plugin: "nav2_behaviors/BackUp"
        backup_dist: 0.5
        backup_speed: 0.3
      spin:
        plugin: "nav2_behaviors/Spin"
      wait:
        plugin: "nav2_behaviors/Wait"
      simulate_ahead_time: 2.0
      # Matched to FollowPath's wz_max above - lowered from 0.4 for the same
      # wheel-slip/odometry reason, so Spin recovery doesn't turn faster than
      # normal path-following is now allowed to.
      max_rotational_vel: 0.15
      # Lowered along with max_rotational_vel above - left at the old 0.15
      # this would equal the new max exactly, leaving Spin zero ramp range
      # (jumps straight to full speed with no gradual start).
      min_rotational_vel: 0.05
      rotational_acc_lim: 1.5
