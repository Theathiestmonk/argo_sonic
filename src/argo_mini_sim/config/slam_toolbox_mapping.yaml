# SLAM Toolbox — mapping mode for the Gazebo simulation.
# Tuning copied from the real robot's config/slam_mapping.yaml (argo_mini
# package) so the presentation reflects the same behaviour that runs on
# hardware. Only use_sim_time and scan_topic differ (sim publishes clean
# scans directly on /scan — no scan_relay timestamp fix needed).
slam_toolbox:
  ros__parameters:
    odom_frame:   odom
    map_frame:    map
    base_frame:   base_link
    scan_topic:   /scan
    mode:         mapping
    use_sim_time: true

    resolution:              0.05
    max_laser_range:          6.0
    minimum_laser_range:      0.20

    minimum_travel_distance: 0.10
    minimum_travel_heading:  0.035
    map_update_interval:     0.5

    use_scan_matching:       true
    use_scan_barycenter:     true

    scan_buffer_size:                   30
    scan_buffer_maximum_scan_distance:  6.0

    do_loop_closing:                    true
    loop_search_maximum_distance:       5.0
    loop_match_minimum_chain_size:      5
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine:   0.50

    distance_variance_penalty: 0.5
    angle_variance_penalty:    1.0

    enable_interactive_mode: true
