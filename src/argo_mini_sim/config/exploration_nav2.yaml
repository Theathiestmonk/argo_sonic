# Overrides loaded ON TOP of nav2_params.yaml during autonomous frontier
# exploration (slam.launch.py use_frontier_exploration:=true). Mirrors the
# real robot's config/exploration_nav2.yaml:
#   bt_navigator      - points to the exploration BT (no Spin/BackUp; only
#                        ClearEntireCostmap recovery, so SLAM's pose graph
#                        never gets distorted by physical recovery motion)
#   planner_server    - NavFn with allow_unknown:true (plans into unmapped space)
#   controller_server - relaxed PathAngleCritic so it doesn't tank-spin at frontiers
#   behavior_server   - Wait only
#   global_costmap    - track_unknown_space:true so frontiers exist to chase
#   local_costmap     - tighter inflation so doorways stay navigable

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    # plugin_lib_names omitted — see nav2_params.yaml; ClearEntireCostmap is
    # a built-in BT node too, auto-registered.

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: true
    FollowPath:
      PathAngleCritic:
        cost_weight: 2.0
        max_angle_to_furthest: 1.57

behavior_server:
  ros__parameters:
    use_sim_time: true
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.265, 0.225], [0.265, -0.225], [-0.265, -0.225], [-0.265, 0.225]]"
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.22

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      inflation_layer:
        inflation_radius: 0.22
