# SLAM Toolbox — localization mode for Nav2 in the Gazebo simulation.
# Mirrors the real robot's config/slam_toolbox.yaml (argo_mini package) —
# the physical robot uses slam_toolbox for localization instead of AMCL, so
# the sim does too for a faithful demo. map_file_name is set at launch time.
slam_toolbox:
  ros__parameters:
    odom_frame:   odom
    map_frame:    map
    base_frame:   base_link
    scan_topic:   /scan
    mode:         localization
    use_sim_time: true

    map_file_name: ""
    map_start_at_dock: true
    # Robot must be placed at this map-frame pose when localization starts —
    # matches the default spawn pose (x/y/yaw launch args) in nav.launch.py /
    # gazebo.launch.py. Without this, slam_toolbox silently starts belief at
    # the literal map origin (0,0,0), which may sit inside an obstacle and
    # make every plan request fail.
    map_start_pose: [-6.5, 1.0, 0.0]

    resolution:         0.05
    max_laser_range:    6.0
    min_laser_range: 0.30

    minimum_travel_distance: 0.05
    minimum_travel_heading:  0.017

    # In localization mode the map is essentially static — republishing it
    # every 2s (mapping-mode's cadence) made /map's dimensions wobble
    # slightly on every republish, which kept global_costmap's static_layer
    # stuck mid-resize and unable to ever complete a publish cycle.
    map_update_interval: 30.0

    use_scan_matching:    true
    use_scan_barycenter:  true

    scan_buffer_size:                  5
    scan_buffer_maximum_scan_distance: 4.0

    do_loop_closing: false

    distance_variance_penalty: 0.5
    angle_variance_penalty:    1.0

    enable_interactive_mode: false
